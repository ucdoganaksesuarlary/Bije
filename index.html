<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şansly Bilet - Online Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --error: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 15px 0 15px;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .badge-price {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    input.input-error {
      border-color: var(--error) !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2) !important;
    }

    .error-msg {
      color: var(--error);
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    .input-readonly {
      background: rgba(15, 23, 42, 0.6);
      color: var(--accent);
      font-weight: 700;
      font-size: 18px;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    footer {
      width: 100%;
      text-align: center;
      padding: 25px 0;
      margin-top: 40px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    footer span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <div class="brand-header">
      <h1 class="brand-title">ŞANSLY BİLET</h1>
      <p class="brand-subtitle">Sertifikatlaşdyrylan Online Bilet Portaly</p>
    </div>

    <div class="badge-price">
      <span>Bilet Bahasy:</span>
      <span style="font-size: 20px; font-weight: 700;">$10</span>
    </div>

    <form id="ticketForm">
      <div class="form-group">
        <label for="fullname">Adyňyz we Familiýaňyz</label>
        <input type="text" id="fullname" placeholder="Meselem: Aman Hayitmuradov" oninput="clearError('fullname')">
        <div id="fullname-error" class="error-msg">Haýyş edýäris, adyňyz we familiýaňyz ýazyň!</div>
      </div>

      <div class="form-group">
        <label for="phone">Habarlaşmak üçin Telefon Belgiňiz</label>
        <input type="tel" id="phone" placeholder="+99361234567" oninput="clearError('phone')">
        <div id="phone-error" class="error-msg">Haýyş edýäris, telefon belgiňiz ýazyň!</div>
      </div>

      <div class="form-group">
        <label for="count">Bilet Sany</label>
        <input type="number" id="count" value="1" min="1" max="100" oninput="updateTotal()">
      </div>

      <div class="form-group">
        <label>Jemi Töleg Sümmasy</label>
        <input type="text" id="total" class="input-readonly" value="$10" readonly>
      </div>

      <button type="button" class="btn-submit" onclick="sendWhatsApp()">
        <span>Bilet Resmileşdir (WhatsApp)</span>
      </button>
    </form>
  </div>
</div>

<footer>
  <p>© 2026 Şansly Bilet. Ähli hukuklar goralan.</p>
  <span>Platforma ygtyýarly ulgam tarapyndan dolandyrylýar.</span>
</footer>

<script>
  function updateTotal() {
    const countInput = document.getElementById('count');
    let count = parseInt(countInput.value) || 1;
    if (count < 1) count = 1;
    document.getElementById('total').value = '$' + (count * 10);
  }

  function clearError(fieldId) {
    document.getElementById(fieldId).classList.remove('input-error');
    document.getElementById(fieldId + '-error').style.display = 'none';
  }

  function sendWhatsApp() {
    const nameInput = document.getElementById('fullname');
    const phoneInput = document.getElementById('phone');
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    const count = document.getElementById('count').value;
    const total = count * 10;

    let isValid = true;

    if (!name) {
      nameInput.classList.add('input-error');
      document.getElementById('fullname-error').style.display = 'block';
      isValid = false;
    }

    if (!phone) {
      phoneInput.classList.add('input-error');
      document.getElementById('phone-error').style.display = 'block';
      isValid = false;
    }

    if (!isValid) return;

    const adminPhone = "905016873001";
    const text = `Salam, men bilet satyn aljak bolýaryn.%0A%0A👤 **Müşderi:** ${encodeURIComponent(name)}%0A📞 **Tel:** ${encodeURIComponent(phone)}%0A🎟️ **Bilet Sany:** ${count}%0A💰 **Jemi Baha:** $${total}`;

    window.open(`https://wa.me/${adminPhone}?text=${text}`, '_blank');
  }
</script>

</body>
</html>
